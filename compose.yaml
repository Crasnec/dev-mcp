name: dev-mcp

services:
  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    environment:
      WORKSPACE_ROOT: /workspace
      RUNNER_DATA_DIR: /var/lib/dev-mcp
      RUNNER_SOCKET: /ipc/runner.sock
      MAX_CONCURRENT_COMMANDS: ${MAX_CONCURRENT_COMMANDS:-4}
      MAX_CONCURRENT_PROCESSES: ${MAX_CONCURRENT_PROCESSES:-8}
      DEFAULT_COMMAND_TIMEOUT_MS: ${DEFAULT_COMMAND_TIMEOUT_MS:-0}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-65536}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:?Set WORKSPACE_DIR in .env}
        target: /workspace
      - runner-data:/var/lib/dev-mcp
      - runner-ipc:/ipc
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    networks:
      - runner-egress
    healthcheck:
      test: [CMD, node, -e, "require('fs').statSync('/ipc/runner.sock').isSocket()||process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: https://${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Generate ADMIN_PASSWORD_HASH with npm run password-hash}
      GATEWAY_DATA_DIR: /var/lib/dev-mcp
      RUNNER_SOCKET: /ipc/runner.sock
    volumes:
      - gateway-data:/var/lib/dev-mcp
      - runner-ipc:/ipc
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  caddy:
    image: caddy:2.11.4
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  gateway-data:
  runner-data:
  runner-ipc:
  caddy-data:
  caddy-config:

networks:
  edge:
  runner-egress:
