name: dev-mcp

services:
  # Builds the runner image only: `docker compose build runner`. The
  # provisioner starts one dedicated runner per account, administrators
  # included; no shared runner container runs from this file.
  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    image: ${RUNNER_IMAGE:-dev-mcp-runner:latest}
    profiles: [image]

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: https://${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
      GATEWAY_DATA_DIR: /var/lib/dev-mcp
      USER_RUNNER_SOCKET_DIR: /user-ipc
      RUNNER_STATUS_DIR: /runner-status
      ONBOARDING_PORT: "3100"
    # Local onboarding only: published on the host loopback, never via Caddy.
    ports:
      - "127.0.0.1:${ONBOARDING_HOST_PORT:-3100}:3100"
    volumes:
      - gateway-data:/var/lib/dev-mcp
      - runner-status:/runner-status:ro
      - type: bind
        source: ${USER_RUNNER_IPC_DIR:-./data/user-ipc}
        target: /user-ipc
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Trusted control-plane service. Docker access is never mounted in gateway or runners.
  provisioner:
    build:
      context: .
      dockerfile: docker/provisioner.Dockerfile
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-dev-mcp}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-dev-mcp-runner:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/gateway-data:ro
      - runner-status:/runner-status
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    cap_drop: [ALL]
    # Account records are mode 0600 and owned by the gateway's UID.
    cap_add: [DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    network_mode: none
    depends_on:
      gateway:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  gateway-data:
  runner-status:
  caddy-data:
  caddy-config:

networks:
  edge:
